name: backend
on:
  push: { paths: ['paBudget-backend/**', '.github/workflows/backend.yml'] }
  pull_request: { paths: ['paBudget-backend/**'] }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: pabudget, POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: pabudget_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pabudget" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: paBudget-backend } }
    env:
      DATABASE_URL: postgresql://pabudget@localhost:5432/pabudget_test
      TEST_DATABASE_URL: postgresql://pabudget@localhost:5432/pabudget_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: paBudget-backend/package-lock.json }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
