name: web
on:
  push: { paths: ['paBudget-web/**', '.github/workflows/web.yml'] }
  pull_request: { paths: ['paBudget-web/**'] }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: paBudget-web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: paBudget-web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
