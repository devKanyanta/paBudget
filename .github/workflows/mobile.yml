name: mobile
on:
  push: { paths: ['paBudget-mobile/**', '.github/workflows/mobile.yml'] }
  pull_request: { paths: ['paBudget-mobile/**'] }
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: paBudget-mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
